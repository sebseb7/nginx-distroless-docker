user ubuntu;
worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout 65;

    # Global catch-all HTTP server: Redirects all port 80 traffic to HTTPS
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        # Let's Encrypt ACME challenge validation path
        location ^~ /.well-known/acme-challenge/ {
            root /home/ubuntu/letsencrypt;
            default_type "text/plain";
        }

        # Force redirect everything else to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # Load all virtual server files
    include /home/ubuntu/nginx.conf.d/*.conf;
}
